apiVersion: v1
kind: Service
metadata:
  name: coremlwin-runtime
  namespace: ml-inference
  labels:
    app: coremlwin
    component: runtime
spec:
  type: ClusterIP
  selector:
    app: coremlwin
    component: runtime
  ports:
  - name: runtime
    port: 9001
    targetPort: 9001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coremlwin-config
  namespace: ml-inference
data:
  log_level: "INFO"
  runtime_config.yaml: |
    service:
      max_clients: 100
      pipe_name: "\\\\.\\pipe\\coremlwin_runtime"
    
    cache:
      directory: "/cache"
      max_models: 50
      max_cache_size_gb: 10
    
    logging:
      level: "INFO"
      log_to_file: true
      log_to_console: true
    
    benchmark:
      warmup_iterations: 5
      benchmark_iterations: 50
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coremlwin-cache-pvc
  namespace: ml-inference
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coremlwin-models-pvc
  namespace: ml-inference
spec:
  accessModes:
  - ReadOnlyMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
