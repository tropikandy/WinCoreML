name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CoreMLWin v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🚀 CoreMLWin v${{ steps.version.outputs.VERSION }}

            Universal Machine Learning Runtime for Windows with DirectML GPU acceleration.

            ### ✨ Features
            - **Universal GPU Support** - Works on NVIDIA, AMD, and Intel GPUs via DirectML
            - **Zero Configuration** - No CUDA installation required
            - **Production Ready** - Security hardened and comprehensively tested
            - **Open Source** - MIT licensed, community-driven

            ### 📦 Installation

            **Build from Source:**
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd WinCoreML
            # See README.md for build instructions
            ```

            **Winget (Coming Soon):**
            ```powershell
            winget install CoreMLWin.UniversalMLRuntime
            ```

            ### 📋 Requirements
            - Windows 10 version 1903+ or Windows 11
            - DirectX 12 capable GPU (for acceleration)
            - Visual C++ Redistributable 2022
            - Python 3.10+ (for Python SDK)

            ### 🚀 Quick Start

            ```python
            from coremlwin_client import CoreMLWinClient
            client = CoreMLWinClient()
            print(client.health())
            ```

            ### 📚 Documentation
            - [README](README.md)
            - [Installation Guide](docs/INSTALLATION.md)
            - [User Scenarios](docs/USER_SCENARIOS.md)
            - [Security Audit](docs/RED_TEAM_AUDIT.md)

            ### 🙏 Built With
            - ONNX Runtime - High-performance ML inference
            - DirectML - GPU acceleration on Windows
            - Protocol Buffers - Efficient serialization

            **Not affiliated with Apple Inc.** CoreML is a trademark of Apple Inc.

            ---

            **Documentation**: https://github.com/${{ github.repository }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
