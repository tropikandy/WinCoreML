name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy protobuf pywin32

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Download ONNX Runtime
        shell: powershell
        run: |
          $version = "1.16.3"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-gpu-$version.zip"

          Write-Host "Downloading ONNX Runtime $version..."
          Invoke-WebRequest -Uri $url -OutFile "onnxruntime.zip"

          Write-Host "Extracting..."
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "."

          $onnxDir = Get-ChildItem -Directory -Filter "onnxruntime-win-x64-gpu-*" | Select-Object -First 1
          echo "ONNXRUNTIME_DIR=$($onnxDir.FullName)" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_DIR=$env:ONNXRUNTIME_DIR

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: powershell
        run: |
          # Start service in background
          Start-Process -FilePath "build\bin\Release\coremlwin_service.exe" -WindowStyle Hidden

          # Wait for service startup
          Start-Sleep -Seconds 5

          # Run Python integration tests
          $env:PYTHONPATH = "sdk/python"
          pytest tests/test_integration.py -v --tb=short

          # Stop service
          Stop-Process -Name "coremlwin_service" -Force -ErrorAction SilentlyContinue

      - name: Install WiX Toolset
        shell: powershell
        run: |
          Write-Host "Installing WiX Toolset..."
          dotnet tool install --global wix --version 4.0.4
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Build MSI Installer
        shell: powershell
        run: |
          cd installer/wix
          .\build-installer.ps1 -BuildDir "..\..\build\bin\Release"

      - name: Create Portable Package
        shell: powershell
        run: |
          .\installer\create-portable.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Generate Checksums
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          # MSI checksum
          $msiHash = (Get-FileHash "installer\wix\output\CoreMLWin-$version-x64.msi" -Algorithm SHA256).Hash
          $msiHash | Out-File "installer\wix\output\CoreMLWin-$version-x64.msi.sha256"

          # Portable ZIP checksum (already created by create-portable.ps1)

          Write-Host "MSI SHA256: $msiHash"
          echo "MSI_SHA256=$msiHash" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            installer/wix/output/CoreMLWin-*.msi
            installer/wix/output/CoreMLWin-*.msi.sha256
            installer/portable/CoreMLWin-*-portable-x64.zip
            installer/portable/CoreMLWin-*-portable-x64.zip.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CoreMLWin v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🚀 CoreMLWin v${{ steps.version.outputs.VERSION }}

            Universal Machine Learning Runtime for Windows with DirectML GPU acceleration.

            ### ✨ Features
            - **ONNX Runtime Integration** - Full support for ONNX models
            - **DirectML GPU Acceleration** - NVIDIA, AMD, and Intel GPUs
            - **Python SDK** - Easy-to-use client library
            - **Production Ready** - Security hardened and tested
            - **Multi-format Support** - ONNX, PyTorch, TensorFlow

            ### 📦 Installation Options

            #### Option 1: MSI Installer (Recommended)
            Download `CoreMLWin-${{ steps.version.outputs.VERSION }}-x64.msi` and double-click to install.

            ```powershell
            # Or install silently
            msiexec /i CoreMLWin-${{ steps.version.outputs.VERSION }}-x64.msi /quiet
            ```

            #### Option 2: Portable (No Installation)
            Download `CoreMLWin-${{ steps.version.outputs.VERSION }}-portable-x64.zip`, extract, and run `start-service.bat`.

            #### Option 3: Winget (Coming Soon)
            ```powershell
            winget install CoreMLWin.UniversalMLRuntime
            ```

            ### 📋 Requirements
            - Windows 10 version 1903 (build 18362) or newer
            - DirectX 12 capable GPU for GPU acceleration (optional)
            - Visual C++ Redistributable 2022

            ### 🚀 Quick Start

            ```powershell
            # Install Python SDK
            pip install coremlwin

            # Test installation
            python -c "from coremlwin_client import CoreMLWinClient; print(CoreMLWinClient().health())"
            ```

            ### 📊 Checksums

            **MSI Installer**:
            ```
            SHA256: ${{ env.MSI_SHA256 }}
            ```

            **Portable ZIP**:
            See `CoreMLWin-${{ steps.version.outputs.VERSION }}-portable-x64.zip.sha256`

            ### 📚 Documentation
            - [Installation Guide](docs/INSTALLATION.md)
            - [Distribution Guide](docs/DISTRIBUTION_GUIDE.md)
            - [Security Audit Report](docs/RED_TEAM_AUDIT.md)

            ### 🐛 Known Issues
            None at this time. Please report issues on GitHub.

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}
          files: |
            installer/wix/output/CoreMLWin-*.msi
            installer/wix/output/CoreMLWin-*.msi.sha256
            installer/portable/CoreMLWin-*-portable-x64.zip
            installer/portable/CoreMLWin-*-portable-x64.zip.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment with winget instructions
        uses: actions/github-script@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            const version = '${{ steps.version.outputs.VERSION }}';
            const msiSha = '${{ env.MSI_SHA256 }}';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Next Step: Submit to Winget

            Your release is published! To make it available via \`winget install\`:

            ### Automated Method

            \`\`\`powershell
            # Install wingetcreate
            winget install wingetcreate

            # Submit to winget-pkgs (will open PR automatically)
            wingetcreate update CoreMLWin.UniversalMLRuntime \\
              --urls https://github.com/${{ github.repository }}/releases/download/v${version}/CoreMLWin-${version}-x64.msi \\
              --version ${version} \\
              --submit
            \`\`\`

            ### Manual Method

            1. Fork https://github.com/microsoft/winget-pkgs
            2. Update manifests in \`installer/winget/\` with:
               - InstallerUrl: \`https://github.com/${{ github.repository }}/releases/download/v${version}/CoreMLWin-${version}-x64.msi\`
               - InstallerSha256: \`${msiSha}\`
            3. Copy manifests to \`manifests/c/CoreMLWin/UniversalMLRuntime/${version}/\`
            4. Create PR to microsoft/winget-pkgs

            See [docs/DISTRIBUTION_GUIDE.md](docs/DISTRIBUTION_GUIDE.md) for full details.`
            });
