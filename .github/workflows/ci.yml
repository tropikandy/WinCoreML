name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  BUILD_TYPE: Release
  ONNXRUNTIME_VERSION: 1.16.3

jobs:
  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Unit tests (Python)
  test-python:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy protobuf
    
    - name: Run unit tests
      run: |
        cd tests
        pytest test_unit.py -v --cov=../sdk/python --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./tests/coverage.xml
        flags: python

  # C++ build and tests
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Install dependencies
      run: |
        choco install -y cmake protobuf
    
    - name: Download ONNX Runtime
      run: |
        $url = "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ONNXRUNTIME_VERSION }}/onnxruntime-win-x64-gpu-${{ env.ONNXRUNTIME_VERSION }}.zip"
        Invoke-WebRequest -Uri $url -OutFile onnxruntime.zip
        Expand-Archive onnxruntime.zip -DestinationPath C:\onnxruntime
        echo "ONNXRUNTIME_DIR=C:\onnxruntime\onnxruntime-win-x64-gpu-${{ env.ONNXRUNTIME_VERSION }}" >> $env:GITHUB_ENV
    
    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64
    
    - name: Build
      run: |
        cmake --build build --config ${{ env.BUILD_TYPE }}
    
    - name: Run C++ security tests
      run: |
        cd tests
        g++ -std=c++17 test_security_utils.cpp -I../runtime/include -o test_security_utils.exe
        .\test_security_utils.exe
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coremlwin-windows-x64
        path: build/bin/Release/
        retention-days: 7

  # Docker build
  build-docker:
    name: Build Docker Image
    runs-on: windows-latest
    needs: [build-windows]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: coremlwin-windows-x64
        path: build/bin/Release/
    
    - name: Build Docker image
      run: |
        docker build -t coremlwin/runtime:${{ github.sha }} .
    
    - name: Push to Docker Hub
      if: github.event_name == 'release'
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker tag coremlwin/runtime:${{ github.sha }} coremlwin/runtime:latest
        docker push coremlwin/runtime:${{ github.sha }}
        docker push coremlwin/runtime:latest

  # Create release packages
  package-release:
    name: Create Release Packages
    runs-on: windows-latest
    needs: [test-python, build-windows, security-scan]
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: coremlwin-windows-x64
        path: build/bin/Release/
    
    - name: Install WiX Toolset
      run: |
        choco install -y wixtoolset
    
    - name: Build MSI installer
      run: |
        cd installer/wix
        .\build-installer.ps1
    
    - name: Create portable ZIP
      run: |
        Compress-Archive -Path build/bin/Release/* -DestinationPath CoreMLWin-${{ github.ref_name }}-portable-x64.zip
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          installer/wix/output/CoreMLWin-*.msi
          CoreMLWin-*-portable-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
