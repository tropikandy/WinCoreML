name: CI Pipeline

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  # Lint and basic checks
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('sdk/python/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
          ${{ runner.os }}-pip-

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Run flake8
      continue-on-error: true
      run: |
        flake8 sdk/python --max-line-length=100 --ignore=E501,W503,F401

    - name: Check Python formatting
      run: |
        black --check sdk/python

  # Python SDK tests (Linux - faster for unit tests)
  test-python-sdk:
    name: Test Python SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('sdk/python/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install numpy protobuf

    - name: Install SDK
      run: |
        cd sdk/python
        pip install -e . || pip install .

    - name: Test SDK imports
      run: |
        python -c "import coreml_win; print('✓ SDK imports successfully')"

  # Windows build verification
  build-verify:
    name: Verify Windows Build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check project structure
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "Checking project structure..."

        if (Test-Path "runtime") {
          Write-Host "✓ Runtime directory found"
        } else {
          Write-Host "⚠ Runtime directory not found"
        }

        if (Test-Path "sdk/python") {
          Write-Host "✓ Python SDK found"
        } else {
          Write-Host "⚠ Python SDK not found"
        }

        if (Test-Path "README.md") {
          Write-Host "✓ README.md found"
        }

        if (Test-Path "LICENSE") {
          Write-Host "✓ LICENSE found"
        }

        Write-Host "Project structure check completed successfully"
        exit 0

    - name: Verify documentation
      continue-on-error: true
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $requiredDocs = @(
          "README.md",
          "LICENSE",
          "CONTRIBUTING.md",
          "docs/INSTALLATION.md"
        )

        foreach ($doc in $requiredDocs) {
          if (Test-Path $doc) {
            Write-Host "✓ $doc exists"
          } else {
            Write-Host "⚠ Missing: $doc"
          }
        }
        exit 0

  # Status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test-python-sdk, build-verify]
    if: always()
    steps:
    - name: Check CI status
      run: |
        echo "CI pipeline completed"
        echo "Security scan: ${{ needs.security-scan.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "Python tests: ${{ needs.test-python-sdk.result }}"
        echo "Build verify: ${{ needs.build-verify.result }}"

        # Fail if any required job failed
        if [[ "${{ needs.security-scan.result }}" == "failure" ]] || \
           [[ "${{ needs.lint.result }}" == "failure" ]] || \
           [[ "${{ needs.test-python-sdk.result }}" == "failure" ]] || \
           [[ "${{ needs.build-verify.result }}" == "failure" ]]; then
          echo "❌ One or more CI jobs failed"
          exit 1
        fi

        echo "✅ All CI jobs passed successfully"
