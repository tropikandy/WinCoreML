version: '3.8'

services:
  coremlwin:
    build:
      context: .
      dockerfile: Dockerfile
    image: coremlwin/runtime:0.1.0
    container_name: coremlwin-runtime
    
    ports:
      - "9001:9001"
    
    volumes:
      - coremlwin-cache:/coremlwin/cache
      - ./models:/coremlwin/models:ro
    
    environment:
      - COREMLWIN_LOG_LEVEL=INFO
      - COREMLWIN_CACHE_DIR=/coremlwin/cache
    
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      
      # GPU support (requires DirectML)
      devices:
        - driver: dxcore
          count: 1
    
    healthcheck:
      test: ["CMD", "python", "-c", "from coremlwin_client import CoreMLWinClient; CoreMLWinClient().health()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  coremlwin-cache:
    driver: local

networks:
  default:
    name: coremlwin-network
